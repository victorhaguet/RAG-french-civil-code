# Single source for the embedding model, shared by the build (which bakes the
# vector store with it) and the runtime (which must embed queries with it).
x-embedding-model: &embedding-model intfloat/multilingual-e5-small

services:
  api:
    build:
      context: .
      args:
        EMBEDDING_MODEL: *embedding-model
    image: rag-french-civil-code:latest
    # Optional: without it the container still starts and /health works, only
    # /query needs OPENAI_API_KEY.
    env_file:
      - path: .env
        required: false
    environment:
      # No value: passed through from the shell when exported there; when
      # it isn't, .env's value is kept rather than overridden with "".
      OPENAI_API_KEY:
      # Pinned to what the image baked: `environment` wins over `env_file`,
      # so a local .env can't point the API at a different embedding model
      # or at data that doesn't exist in the image.
      EMBEDDING_MODEL: *embedding-model
      CHROMA_PERSIST_DIR: /app/data/chroma
      CHROMA_COLLECTION_NAME: code_civil
      ARTICLES_DB_PATH: /app/data/articles.db
      # Pinned like the above, so a .env written for a local `uvicorn` run
      # (JWKS on localhost) can't break token checks in here. `iss` is the
      # public URL the browser reached Keycloak at, but the keys are fetched
      # over the Compose network: from this container, localhost is the API.
      OAUTH_ISSUER: http://localhost:8080/realms/code-civil
      OAUTH_JWKS_URL: http://keycloak:8080/realms/code-civil/protocol/openid-connect/certs
      OAUTH_AUDIENCE: http://localhost:8000/mcp
    # Start order only: the JWKS is fetched on the first authenticated
    # request, so the API tolerates Keycloak being ready after it.
    depends_on:
      - keycloak
    ports:
      # Localhost only: no TLS, and /docs's login redirects to localhost.
      - "127.0.0.1:8000:8000"
    # Healthcheck on /health: defined in the Dockerfile, inherited here.
    restart: unless-stopped

  # Authorization server: issues the Access Tokens the API checks. Dev mode
  # (plain HTTP) on an in-memory database: the realm is imported again from
  # keycloak/code-civil-realm.json on every start, restarts included, and
  # nothing else persists (start-dev's default H2 file would keep the realm,
  # and --import-realm skips a realm that already exists).
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm", "--db=dev-mem"]
    environment:
      # From .env (Compose interpolation): the only real secret of the stack.
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env (see .env.example)}
      # Every token's `iss` is built from this public URL, whichever address
      # Keycloak was reached at (browser: localhost, API: keycloak), so it
      # always equals the API's OAUTH_ISSUER.
      KC_HOSTNAME: http://localhost:8080
    volumes:
      - ./keycloak/code-civil-realm.json:/opt/keycloak/data/import/code-civil-realm.json:ro
    ports:
      # Localhost only, like the API.
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
