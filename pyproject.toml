[project]
name = "rag-french-civil-code"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "datasets>=5.0.1",
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.6.0",
    "langchain-openai>=1.6.0",
    "langchain-text-splitters>=1.1.2",
    "lingua-language-detector>=2.2.0",
    "nltk>=3.10.3",
    "python-dotenv>=1.2.3",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.0.0",
    "torch>=2.6.0",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# Pinned to the cu124 wheel index rather than PyPI's default torch build: PyPI
# tracks the newest CUDA runtime (currently 13.0), which needs a newer NVIDIA
# driver than most machines (including this project's dev machine, capped at
# CUDA 12.4) actually have — `torch.cuda.is_available()` then silently returns
# False and everything falls back to CPU. cu124 is the oldest CUDA build still
# receiving torch releases, so any driver new enough to run it at all supports
# it (drivers are backwards compatible with older CUDA versions).
[tool.uv.sources]
torch = [{ index = "pytorch-cu124" }]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.mypy.overrides]]
module = ["datasets", "nltk", "nltk.*", "rank_bm25"]
ignore_missing_imports = true
