[project]
name = "rag-french-civil-code"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "datasets>=5.0.1",
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.6.0",
    "langchain-openai>=1.6.0",
    "langchain-text-splitters>=1.1.2",
    "lingua-language-detector>=2.2.0",
    "nltk>=3.10.3",
    "python-dotenv>=1.2.3",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.0.0",
    "uvicorn>=0.52.4",
]

# torch isn't a plain dependency: which accelerator build it resolves to
# differs by machine (GPU dev box vs CPU-only CI), so it's selected via one of
# these two mutually exclusive extras instead -- see [tool.uv.sources]/
# [tool.uv.conflicts] below. `uv sync` needs one of `--extra cpu`/`--extra
# cu124` explicitly; there's no default (forgetting it means no torch at all,
# and nothing that imports it will work).
[project.optional-dependencies]
cpu = ["torch>=2.6.0"]
cu124 = ["torch>=2.6.0"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pylint>=4.1.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
eval = [
    "ragas>=0.4.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# `cu124` is pinned to that specific wheel index rather than PyPI's default
# torch build: PyPI tracks the newest CUDA runtime (currently 13.0), which
# needs a newer NVIDIA driver than most machines (including this project's dev
# machine, capped at CUDA 12.4) actually have — `torch.cuda.is_available()`
# then silently returns False and everything falls back to CPU. cu124 is the
# oldest CUDA build still receiving torch releases, so any driver new enough
# to run it at all supports it (drivers are backwards compatible with older
# CUDA versions).
#
# `cpu` exists so CI (no GPU at all) doesn't pay for ~3GB of CUDA runtime
# libraries (cuDNN, cuBLAS, NCCL, ...) it can never use -- a CUDA-enabled
# torch wheel still runs fine on a CPU-only machine, it's just a wasted
# download. `conflicts` tells uv's resolver these two extras are mutually
# exclusive, so one `uv.lock` covers both and `--locked` holds for either.
[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu124" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu124", extra = "cu124" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["datasets", "nltk", "nltk.*", "rank_bm25"]
ignore_missing_imports = true

# Every rule not listed here keeps pylint's defaults, thresholds included.
# Exceptions live only here: no inline `# pylint: disable` comments.
[tool.pylint.main]
# lingua is a compiled extension; without this pylint can't introspect it and
# reports a false no-name-in-module.
extension-pkg-allow-list = ["lingua"]

[tool.pylint."messages control"]
disable = [
    # Style: docstrings aren't required on every test function and small helper.
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    # Style: the project uses no formatter, and docstrings/test data run long.
    "line-too-long",
    # Style: fakes, schemas and data holders legitimately have few methods.
    "too-few-public-methods",
    # Project convention: heavy libraries (nltk, sentence-transformers, ragas,
    # langchain-openai, lingua, datasets) are imported lazily.
    "import-outside-toplevel",
    # False positives on the `[x] = some_list` idiom in tests, which asserts
    # exactly one item; Python raises at runtime if the count is wrong anyway.
    "unbalanced-tuple-unpacking",
    # The RAGAS judge step catches every exception so that one judge failure
    # doesn't abort a whole Golden Question run.
    "broad-exception-caught",
]
