[project]
name = "rag-french-civil-code"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "datasets>=5.0.1",
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.6.0",
    "langchain-openai>=1.6.0",
    "langchain-text-splitters>=1.1.2",
    "lingua-language-detector>=2.2.0",
    "nltk>=3.10.3",
    "python-dotenv>=1.2.3",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.0.0",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[[tool.mypy.overrides]]
module = ["datasets", "nltk", "nltk.*", "rank_bm25"]
ignore_missing_imports = true
