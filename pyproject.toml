[project]
name = "rag-french-civil-code"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "datasets>=5.0.1",
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.6.0",
    "langchain-text-splitters>=1.1.2",
    "python-dotenv>=1.2.3",
    "sentence-transformers>=6.0.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_french_civil_code"]

[[tool.mypy.overrides]]
module = ["datasets"]
ignore_missing_imports = true
