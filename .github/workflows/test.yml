name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        # --extra cpu: this runner has no GPU, so pull torch's CPU-only build
        # instead of the ~3GB CUDA runtime the cu124 extra resolves to (see
        # pyproject.toml's [tool.uv.sources] comment). Required -- torch has
        # no default extra, so omitting this falls back to PyPI's newest
        # (CUDA-bundled) build instead of failing loudly.
        run: uv sync --locked --extra cpu

      - name: Run tests with coverage
        run: uv run pytest --cov=src --cov-fail-under=90
